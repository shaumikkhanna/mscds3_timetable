<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Academic Timetable Planner</title>
		<style>
			:root {
				--bg: #f8fafc;
				--panel: #ffffff;
				--text: #1e293b;
				--text-muted: #64748b;
				--border: #cbd5e1;
				--primary: #2563eb;
				--primary-hover: #1d4ed8;
				--danger: #ef4444;
				--radius: 8px;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					sans-serif;
			}

			body {
				background-color: var(--bg);
				color: var(--text);
				padding: 24px;
				line-height: 1.5;
				min-width: 320px;
			}

			.btn {
				background: var(--primary);
				color: white;
				border: none;
				padding: 8px 16px;
				border-radius: var(--radius);
				font-weight: 600;
				cursor: pointer;
				transition: background 0.2s;
			}
			.btn:hover {
				background: var(--primary-hover);
			}
			.btn-secondary {
				background: #e2e8f0;
				color: var(--text);
			}
			.btn-secondary:hover {
				background: #cbd5e1;
			}
			.btn-danger {
				background: #fee2e2;
				color: #dc2626;
			}
			.btn-danger:hover {
				background: #fca5a5;
			}

			.layout {
				display: grid;
				grid-template-columns: 320px 1fr;
				gap: 24px;
				align-items: start;
			}

			/* Sidebar / Course Panel */
			.sidebar {
				background: var(--panel);
				padding: 20px;
				border-radius: var(--radius);
				border: 1px solid var(--border);
				height: fit-content;
			}

			.sidebar h2 {
				font-size: 1.1rem;
				margin-bottom: 12px;
			}

			.sidebar-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				margin-bottom: 12px;
			}

			.sidebar-header h2 {
				margin-bottom: 0;
			}

			.btn-small {
				padding: 6px 10px;
				font-size: 0.78rem;
				white-space: nowrap;
			}

			.course-item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px;
				border: 1px solid var(--border);
				border-radius: var(--radius);
				margin-bottom: 10px;
				background: #fafafa;
				gap: 10px;
			}

			.sidebar-section {
				margin-top: 18px;
				padding-top: 16px;
				border-top: 1px solid var(--border);
			}

			.sidebar-section h2 {
				margin-bottom: 10px;
			}

			.category-group {
				border: 1px solid var(--border);
				border-radius: var(--radius);
				margin-bottom: 10px;
				background: #ffffff;
				overflow: hidden;
			}

			.category-toggle {
				width: 100%;
				border: none;
				background: #f8fafc;
				color: var(--text);
				padding: 10px 12px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-weight: 700;
				cursor: pointer;
				text-align: left;
			}

			.category-toggle:hover {
				background: #f1f5f9;
			}

			.category-count {
				color: var(--text-muted);
				font-size: 0.75rem;
				font-weight: 600;
			}

			.other-course-list {
				display: none;
				padding: 8px;
			}

			.category-group.open .other-course-list {
				display: block;
			}

			.other-course-item {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 8px;
				align-items: start;
				padding: 8px 4px;
				border-top: 1px solid #eef2f7;
			}

			.other-course-item:first-child {
				border-top: none;
			}

			.other-course-item input {
				margin-top: 3px;
			}

			.other-course-details strong {
				display: block;
				font-size: 0.85rem;
			}

			.other-course-details span {
				color: var(--text-muted);
				display: block;
				font-size: 0.72rem;
			}

			.empty-note {
				color: var(--text-muted);
				font-size: 0.8rem;
				padding: 8px 2px;
			}

			.course-info {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
			}

			.course-info input,
			.other-course-item input {
				width: 18px;
				height: 18px;
				accent-color: var(--primary);
				flex-shrink: 0;
			}

			.color-pill {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				flex-shrink: 0;
			}

			.course-details {
				min-width: 0;
			}

			.course-details strong {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 0.95rem;
				flex-wrap: wrap;
			}
			.course-details span {
				font-size: 0.75rem;
				color: var(--text-muted);
				display: block;
				overflow-wrap: anywhere;
			}

			/* Core Pill Tag */
			.core-pill {
				background: #0f172a;
				color: #ffffff;
				font-size: 0.6rem;
				font-weight: 700;
				padding: 2px 6px;
				border-radius: 4px;
				letter-spacing: 0.5px;
				text-transform: uppercase;
			}

			.course-actions {
				display: flex;
				gap: 6px;
				flex-shrink: 0;
			}

			.btn-icon {
				background: transparent;
				border: none;
				cursor: pointer;
				font-size: 0.9rem;
				color: var(--text-muted);
				padding: 4px 6px;
				border-radius: 4px;
			}
			.btn-icon:hover {
				color: var(--text);
				background: #f1f5f9;
			}

			/* Timetable Grid */
			.timetable-container {
				background: var(--panel);
				padding: 20px;
				border-radius: var(--radius);
				border: 1px solid var(--border);
				overflow-x: auto;
			}

			.mobile-schedule {
				display: none;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				table-layout: fixed;
			}

			th,
			td {
				border: 1px solid var(--border);
				text-align: center;
				padding: 8px;
				vertical-align: top;
				height: 105px;
			}

			th {
				background: #f1f5f9;
				font-size: 0.85rem;
				font-weight: 600;
				color: var(--text-muted);
				height: 40px;
			}

			td.day-header {
				background: #f8fafc;
				font-weight: bold;
				vertical-align: middle;
				width: 70px;
			}

			/* Lunch Column Styles */
			th.lunch-header {
				background: #e2e8f0;
				color: #334155;
				font-weight: 700;
				width: 90px;
			}

			td.lunch-cell {
				background: #f1f5f9;
				color: #64748b;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				vertical-align: middle;
				user-select: none;
			}

			.cell-content {
				display: flex;
				flex-direction: column;
				gap: 6px;
				height: 100%;
			}

			.has-conflict {
				background-color: #fef2f2 !important;
				border: 2px dashed #f87171 !important;
			}

			/* Course Badge in Cell */
			.badge {
				padding: 6px;
				border-radius: 6px;
				font-size: 0.8rem;
				text-align: left;
				font-weight: 600;
				transition: all 0.2s ease;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
			}

			.badge .header-line {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.badge .title {
				font-weight: bold;
				font-size: 0.85rem;
			}
			.badge .sub {
				font-size: 0.7rem;
				font-weight: normal;
				opacity: 0.85;
			}

			/* Unchecked light state */
			.badge.faint {
				background-color: #f8fafc !important;
				color: #a1a1aa !important;
				border: 1px dashed #d4d4d8 !important;
				box-shadow: none;
				opacity: 0.6;
			}

			.conflict-warning {
				color: #dc2626;
				font-size: 0.75rem;
				font-weight: bold;
				margin-top: 4px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 4px;
			}

			/* Modal */
			.modal-overlay {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: rgba(0, 0, 0, 0.4);
				display: flex;
				align-items: center;
				justify-content: center;
				display: none;
			}

			.modal {
				background: white;
				padding: 24px;
				border-radius: var(--radius);
				width: 440px;
				max-width: 90%;
				box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
			}

			.modal h3 {
				margin-bottom: 16px;
			}

			.form-group {
				margin-bottom: 12px;
			}
			.form-group label {
				display: block;
				font-size: 0.85rem;
				font-weight: 600;
				margin-bottom: 4px;
			}
			.form-group input,
			.form-group select {
				width: 100%;
				padding: 8px;
				border: 1px solid var(--border);
				border-radius: 4px;
			}

			.checkbox-group {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 12px;
			}

			.slot-row {
				display: flex;
				gap: 8px;
				margin-bottom: 8px;
				align-items: center;
			}

			.modal-actions {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				margin-top: 20px;
			}

			@media (max-width: 900px) {
				body {
					padding: 14px;
				}

				.layout {
					grid-template-columns: 1fr;
					gap: 14px;
				}

				.sidebar,
				.timetable-container {
					border-radius: 8px;
				}

				.sidebar {
					padding: 14px;
				}

				.sidebar h2 {
					font-size: 1rem;
					margin-bottom: 10px;
				}

				.course-item {
					padding: 11px 10px;
					align-items: flex-start;
				}

				.course-actions {
					margin-top: -2px;
				}

				.btn-icon {
					min-width: 32px;
					min-height: 32px;
					font-size: 1rem;
				}

				.category-toggle {
					min-height: 44px;
				}

				.other-course-list {
					max-height: 360px;
					overflow: auto;
					-webkit-overflow-scrolling: touch;
				}

				.other-course-item {
					padding: 11px 4px;
				}

				.other-course-details strong {
					font-size: 0.82rem;
					line-height: 1.25;
				}

				.other-course-details span {
					font-size: 0.72rem;
				}

				.timetable-container {
					padding: 0;
					border: none;
					background: transparent;
					overflow: visible;
				}

				table {
					display: none;
				}

				.mobile-schedule {
					display: grid;
					gap: 12px;
				}

				.mobile-day {
					background: var(--panel);
					border: 1px solid var(--border);
					border-radius: 8px;
					overflow: hidden;
				}

				.mobile-day-header {
					position: sticky;
					top: 0;
					z-index: 1;
					background: #f1f5f9;
					border-bottom: 1px solid var(--border);
					display: flex;
					justify-content: space-between;
					align-items: center;
					padding: 10px 12px;
					font-weight: 800;
				}

				.mobile-day-count {
					color: var(--text-muted);
					font-size: 0.75rem;
					font-weight: 700;
				}

				.mobile-slot {
					display: grid;
					grid-template-columns: 92px 1fr;
					gap: 10px;
					padding: 10px 12px;
					border-bottom: 1px solid #e5e7eb;
					min-height: 62px;
				}

				.mobile-slot:last-child {
					border-bottom: none;
				}

				.mobile-time {
					color: var(--text-muted);
					font-size: 0.72rem;
					font-weight: 800;
					line-height: 1.25;
					padding-top: 3px;
				}

				.mobile-slot-content {
					display: grid;
					gap: 6px;
					min-width: 0;
				}

				.mobile-empty {
					color: #94a3b8;
					font-size: 0.8rem;
					align-self: center;
				}

				.mobile-lunch {
					background: #f8fafc;
					color: #64748b;
					font-size: 0.72rem;
					font-weight: 800;
					letter-spacing: 1px;
					text-transform: uppercase;
				}

				.mobile-lunch .mobile-slot-content {
					align-self: center;
				}

				.mobile-slot.has-conflict {
					background: #fef2f2;
					border-left: 3px solid #ef4444;
				}

				.badge {
					padding: 7px 8px;
				}

				.badge .header-line {
					gap: 8px;
				}

				.badge .title {
					font-size: 0.82rem;
					overflow-wrap: anywhere;
				}

				.badge .sub {
					font-size: 0.7rem;
					overflow-wrap: anywhere;
				}

				.modal-overlay {
					align-items: flex-end;
				}

				.modal {
					width: 100%;
					max-width: none;
					max-height: 92vh;
					overflow: auto;
					border-radius: 12px 12px 0 0;
					padding: 18px;
				}

				.slot-row {
					display: grid;
					grid-template-columns: 1fr 1fr auto;
				}
			}

			@media (max-width: 520px) {
				body {
					padding: 10px;
				}

				.sidebar {
					padding: 12px;
				}

				.course-item {
					display: grid;
					grid-template-columns: 1fr auto;
					gap: 8px;
				}

				.course-info {
					align-items: flex-start;
				}

				.color-pill {
					width: 12px;
					height: 12px;
					margin-top: 4px;
				}

				.course-details strong {
					font-size: 0.88rem;
				}

				.mobile-slot {
					grid-template-columns: 78px 1fr;
					padding: 10px;
				}

				.mobile-time {
					font-size: 0.68rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="layout">
			<!-- Sidebar -->
			<aside class="sidebar">
				<div class="sidebar-header">
					<h2>Subjects</h2>
					<button
						class="btn btn-secondary btn-small"
						onclick="resetDefaults()"
					>
						Reset Courses
					</button>
				</div>
				<div id="course-list"></div>
				<div class="sidebar-section">
					<h2>Other Courses</h2>
					<div id="other-course-groups"></div>
				</div>
			</aside>

			<!-- Main Timetable Grid -->
			<main class="timetable-container">
				<table>
					<thead>
						<tr id="table-header">
							<th>Day</th>
							<!-- Time headers added dynamically -->
						</tr>
					</thead>
					<tbody id="table-body">
						<!-- Rows added dynamically -->
					</tbody>
				</table>
				<div class="mobile-schedule" id="mobile-schedule"></div>
			</main>
		</div>

		<!-- Modal for Adding / Editing Course -->
		<div class="modal-overlay" id="modal">
			<div class="modal">
				<h3 id="modal-title">Add Subject</h3>

				<div class="form-group">
					<label>Course Code (e.g. TSA)</label>
					<input type="text" id="course-code" placeholder="TSA" />
				</div>

				<div class="form-group">
					<label>Course Name</label>
					<input
						type="text"
						id="course-name"
						placeholder="Time Series Analysis"
					/>
				</div>

				<div class="form-group">
					<label>Instructor</label>
					<input
						type="text"
						id="course-instructor"
						placeholder="M R Srinivasan"
					/>
				</div>

				<div class="checkbox-group">
					<input type="checkbox" id="course-core" />
					<label
						for="course-core"
						style="margin: 0; font-weight: 600; font-size: 0.85rem"
						>Mark as Core Course</label
					>
				</div>

				<div class="form-group">
					<label>Badge Color</label>
					<input type="color" id="course-color" value="#3b82f6" />
				</div>

				<div class="form-group">
					<label>Class Timings</label>
					<div id="slot-container"></div>
					<button
						class="btn btn-secondary"
						style="width: 100%; margin-top: 6px"
						onclick="addSlotInput()"
					>
						+ Add Time Slot
					</button>
				</div>

				<div class="modal-actions">
					<button class="btn btn-secondary" onclick="closeModal()">
						Cancel
					</button>
					<button class="btn" onclick="saveCourse()">
						Save Course
					</button>
				</div>
			</div>
		</div>

			let courses = [];
			let otherCourses = [];
			let editingCourseId = null;

			function hexToSoftStyles(hex) {
				return {
					bgColor: hex + "25",
					textColor: hex,
					color: hex,
				};
			}

			function parseCSVRows(csvText) {
				const rows = [];
				let row = [];
				let cell = "";
				let inQuotes = false;

				for (let i = 0; i < csvText.length; i++) {
					const char = csvText[i];
					const nextChar = csvText[i + 1];

					if (char === '"' && inQuotes && nextChar === '"') {
						cell += '"';
						i++;
					} else if (char === '"') {
						inQuotes = !inQuotes;
					} else if (char === "," && !inQuotes) {
						row.push(cell.trim());
						cell = "";
					} else if ((char === "\n" || char === "\r") && !inQuotes) {
						if (char === "\r" && nextChar === "\n") i++;
						row.push(cell.trim());
						if (row.some((value) => value !== "")) rows.push(row);
						row = [];
						cell = "";
					} else {
						cell += char;
					}
				}

				row.push(cell.trim());
				if (row.some((value) => value !== "")) rows.push(row);
				return rows;
			}

			function escapeHtml(value) {
				return String(value || "").replace(
					/[&<>"']/g,
					(char) =>
						({
							"&": "&amp;",
							"<": "&lt;",
							">": "&gt;",
							'"': "&quot;",
							"'": "&#39;",
						})[char],
				);
			}

			function parseCSV(csvText) {
				const lines = parseCSVRows(csvText);
				const result = [];
				for (let i = 1; i < lines.length; i++) {
					const cols = lines[i];
					const slotsRaw = cols[7] ? cols[7].split("|") : [];
					const slots = slotsRaw.map((s) => {
						const [day, idx] = s.split(":");
						return { day, slotIndex: parseInt(idx, 10) };
					});

					const color = cols[5] || "#3b82f6";
					const styles = hexToSoftStyles(color);

					result.push({
						id: cols[0],
						code: cols[1],
						name: cols[2],
						instructor: cols[3],
						isCore: cols[4] === "true",
						color: styles.color,
						bgColor: styles.bgColor,
						textColor: styles.textColor,
						enabled: cols[6] === "true",
						source: "main",
						slots: slots,
					});
				}
				return result;
			}

			function categoryLabel(category) {
				const normalized = (category || "Other").trim();
				if (/math/i.test(normalized)) return "Math";
				if (/\bcs\b|computer/i.test(normalized)) return "CS";
				if (/\bb\.?s\.?\b|bachelor/i.test(normalized)) return "BS";
				return normalized;
			}

			function colorForIndex(index) {
				const colors = [
					"#0ea5e9",
					"#22c55e",
					"#f97316",
					"#a855f7",
					"#14b8a6",
					"#e11d48",
					"#64748b",
					"#84cc16",
					"#f59e0b",
					"#6366f1",
				];
				return colors[index % colors.length];
			}

			function parseSchedule(schedule) {
				if (!schedule || /unscheduled|tbd/i.test(schedule)) return [];

				const normalizedSlots = TIME_SLOTS.map((slot) =>
					slot.replace("–", "-"),
				);
				return schedule
					.split(",")
					.map((part) => {
						const match = part
							.trim()
							.match(
								/^(Mon|Tue|Wed|Thu|Fri)\s+(\d{2}:\d{2}-\d{2}:\d{2})$/,
							);
						if (!match) return null;
						const slotIndex = normalizedSlots.indexOf(match[2]);
						if (slotIndex === -1) return null;
						return { day: match[1], slotIndex };
					})
					.filter(Boolean);
			}

			function parseOtherCSV(csvText) {
				const rows = parseCSVRows(csvText);
				const result = [];

				for (let i = 1; i < rows.length; i++) {
					const cols = rows[i];
					const color = colorForIndex(i - 1);
					const styles = hexToSoftStyles(color);

					result.push({
						id: "other_" + cols[0],
						code: cols[0],
						name: cols[1],
						instructor: cols[2],
						category: cols[3] || "Other",
						categoryGroup: categoryLabel(cols[3]),
						scheduleText: cols[4] || "Unscheduled / TBD",
						isCore: false,
						color: styles.color,
						bgColor: styles.bgColor,
						textColor: styles.textColor,
						enabled: false,
						source: "other",
						slots: parseSchedule(cols[4]),
					});
				}

				return result;
			}

			async function loadDefaultCSV() {
				try {
					const response = await fetch("courses.csv");
					if (response.ok) {
						const text = await response.text();
						return parseCSV(text);
					}
				} catch (e) {
					console.warn(
						"Could not fetch external courses.csv (likely file:// protocol). Using embedded defaults.",
					);
				}
				return parseCSV(EMBEDDED_CSV);
			}

			async function loadOtherCSV() {
				try {
					const response = await fetch("other_courses.csv");
					if (response.ok) {
						const text = await response.text();
						return parseOtherCSV(text);
					}
				} catch (e) {
					console.warn(
						"Could not fetch external other_courses.csv (likely file:// protocol). Using embedded defaults.",
					);
				}
				return parseOtherCSV(EMBEDDED_OTHER_CSV);
			}

			function saveState() {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
				const interestedIds = courses
					.filter((course) => course.source === "other")
					.map((course) => course.id);
				localStorage.setItem(
					OTHER_INTEREST_STORAGE_KEY,
					JSON.stringify(interestedIds),
				);
			}

			function promoteInterestedOtherCourses(interestedIds) {
				interestedIds.forEach((id) => {
					if (courses.some((course) => course.id === id)) return;
					const otherCourse = otherCourses.find(
						(course) => course.id === id,
					);
					if (otherCourse) {
						courses.push({
							...otherCourse,
							enabled: true,
						});
					}
				});
			}

			async function init() {
				otherCourses = await loadOtherCSV();
				const saved = localStorage.getItem(STORAGE_KEY);
				if (saved) {
					try {
						courses = JSON.parse(saved);
					} catch (e) {
						courses = await loadDefaultCSV();
					}
				} else {
					courses = await loadDefaultCSV();
				}

				const interestedSaved = localStorage.getItem(
					OTHER_INTEREST_STORAGE_KEY,
				);
				if (interestedSaved) {
					try {
						promoteInterestedOtherCourses(
							JSON.parse(interestedSaved),
						);
					} catch (e) {
						console.warn(
							"Could not restore other course interests.",
						);
					}
				}

				renderHeaders();
				renderSidebar();
				renderOtherCourses();
				renderTimetable();
			}

			async function resetDefaults() {
				if (
					confirm(
						"Reset schedule back to CSV defaults? Any custom modifications will be cleared.",
					)
				) {
					courses = await loadDefaultCSV();
					localStorage.removeItem(OTHER_INTEREST_STORAGE_KEY);
					saveState();
					renderSidebar();
					renderOtherCourses();
					renderTimetable();
				}
			}

			function renderOtherCourses() {
				const container = document.getElementById(
					"other-course-groups",
				);
				container.innerHTML = "";

				const grouped = otherCourses.reduce((acc, course) => {
					if (!acc[course.categoryGroup])
						acc[course.categoryGroup] = [];
					acc[course.categoryGroup].push(course);
					return acc;
				}, {});

				Object.keys(grouped)
					.sort()
					.forEach((category) => {
						const group = document.createElement("div");
						group.className = "category-group";

						const interestedCount = grouped[category].filter(
							(course) =>
								courses.some(
									(selected) => selected.id === course.id,
								),
						).length;

						const listHtml = grouped[category]
							.map((course) => {
								const isInterested = courses.some(
									(selected) => selected.id === course.id,
								);
								return `
            <label class="other-course-item">
              <input type="checkbox" ${isInterested ? "checked" : ""} onchange="toggleOtherInterest('${course.id}', this.checked)">
              <span class="other-course-details">
                <strong>${escapeHtml(course.code)} - ${escapeHtml(course.name)}</strong>
                <span>${escapeHtml(course.instructor)}</span>
                <span>${escapeHtml(course.scheduleText)}</span>
              </span>
            </label>
          `;
							})
							.join("");

						group.innerHTML = `
          <button class="category-toggle" type="button" onclick="toggleCategory(this)">
            <span>${escapeHtml(category)}</span>
            <span class="category-count">${interestedCount}/${grouped[category].length}</span>
          </button>
          <div class="other-course-list">
            ${listHtml || '<div class="empty-note">No courses here.</div>'}
          </div>
        `;

						container.appendChild(group);
					});

			function createCourseBadge(course) {
				const badge = document.createElement("div");
				if (course.enabled) {
					badge.className = "badge";
					badge.style.backgroundColor = course.bgColor;
					badge.style.color = course.textColor;
					badge.style.borderLeft = `4px solid ${course.color}`;
				} else {
					badge.className = "badge faint";
				}

				badge.innerHTML = `
        <div class="header-line">
          <span class="title">${escapeHtml(course.code)}</span>
          ${course.isCore && course.enabled ? '<span class="core-pill">CORE</span>' : ""}
        </div>
        <div class="sub">${escapeHtml(course.instructor || "")}</div>
      `;
				return badge;
			}

			function getCoursesForSlot(day, slotIndex) {
				return courses.filter(
					(c) =>
						c.slots &&
						c.slots.some(
							(s) => s.day === day && s.slotIndex === slotIndex,
						),
				);
			}

			function renderDesktopTimetable() {
				const tbody = document.getElementById("table-body");
				tbody.innerHTML = "";

				DAYS.forEach((day) => {
					const tr = document.createElement("tr");

					const dayTd = document.createElement("td");
					dayTd.className = "day-header";
					dayTd.textContent = day;
					tr.appendChild(dayTd);

					TIME_SLOTS.forEach((slot, slotIndex) => {
						const td = document.createElement("td");
						const cellContent = document.createElement("div");
						cellContent.className = "cell-content";

						const matchingCourses = getCoursesForSlot(
							day,
							slotIndex,
						);
						const activeCourses = matchingCourses.filter(
							(c) => c.enabled,
						);
						if (activeCourses.length > 1) {
							td.classList.add("has-conflict");
						}

						matchingCourses.forEach((course) => {
							cellContent.appendChild(createCourseBadge(course));
						});

						if (activeCourses.length > 1) {
							const warning = document.createElement("div");
							warning.className = "conflict-warning";
							warning.innerHTML = "<span>&#9888;</span> Conflict";
							cellContent.appendChild(warning);
						}

						td.appendChild(cellContent);
						tr.appendChild(td);

						// Inject Lunch Break cell after slotIndex 2
						if (slotIndex === 2) {
							const lunchTd = document.createElement("td");
							lunchTd.className = "lunch-cell";
							lunchTd.textContent = "LUNCH";
							tr.appendChild(lunchTd);
						}
					});

					tbody.appendChild(tr);
				});
			}

			function renderMobileTimetable() {
				const container = document.getElementById("mobile-schedule");
				container.innerHTML = "";

				DAYS.forEach((day) => {
					const daySection = document.createElement("section");
					daySection.className = "mobile-day";

					const activeCount = courses.filter(
						(course) =>
							course.enabled &&
							course.slots &&
							course.slots.some((slot) => slot.day === day),
					).length;

					const header = document.createElement("div");
					header.className = "mobile-day-header";
					header.innerHTML = `
          <span>${escapeHtml(day)}</span>
          <span class="mobile-day-count">${activeCount} active</span>
        `;
					daySection.appendChild(header);

					TIME_SLOTS.forEach((slot, slotIndex) => {
						const matchingCourses = getCoursesForSlot(
							day,
							slotIndex,
						);
						const activeCourses = matchingCourses.filter(
							(course) => course.enabled,
						);

						const slotRow = document.createElement("div");
						slotRow.className = "mobile-slot";
						if (activeCourses.length > 1)
							slotRow.classList.add("has-conflict");

						const time = document.createElement("div");
						time.className = "mobile-time";
						time.textContent = slot;

						const content = document.createElement("div");
						content.className = "mobile-slot-content";

						if (matchingCourses.length) {
							matchingCourses.forEach((course) => {
								content.appendChild(createCourseBadge(course));
							});
						} else {
							const empty = document.createElement("div");
							empty.className = "mobile-empty";
							empty.textContent = "Free";
							content.appendChild(empty);
						}

						if (activeCourses.length > 1) {
							const warning = document.createElement("div");
							warning.className = "conflict-warning";
							warning.innerHTML = "<span>&#9888;</span> Conflict";
							content.appendChild(warning);
						}

						slotRow.appendChild(time);
						slotRow.appendChild(content);
						daySection.appendChild(slotRow);

						if (slotIndex === 2) {
							const lunchRow = document.createElement("div");
							lunchRow.className = "mobile-slot mobile-lunch";
							lunchRow.innerHTML = `
              <div class="mobile-time">13:05–14:00</div>
              <div class="mobile-slot-content">Lunch</div>
            `;
							daySection.appendChild(lunchRow);
						}
					});

					container.appendChild(daySection);
				});
			}

			function renderTimetable() {
				renderDesktopTimetable();
				renderMobileTimetable();
			}

			function toggleCourse(id) {
				const course = courses.find((c) => c.id === id);
				if (course) {
					course.enabled = !course.enabled;
					saveState();
					renderSidebar();
					renderTimetable();
				}
			}

			function toggleCategory(button) {
				button.closest(".category-group").classList.toggle("open");
			}

			function toggleOtherInterest(id, checked) {
				if (checked) {
					const otherCourse = otherCourses.find(
						(course) => course.id === id,
					);
					if (
						otherCourse &&
						!courses.some((course) => course.id === id)
					) {
						courses.push({
							...otherCourse,
							enabled: true,
						});
					}
				} else {
					courses = courses.filter((course) => course.id !== id);
				}

				saveState();
				renderSidebar();
				renderOtherCourses();
				renderTimetable();
			}

			function deleteCourse(id) {
				if (confirm("Are you sure you want to delete this course?")) {
					courses = courses.filter((c) => c.id !== id);
					saveState();
					renderSidebar();
					renderOtherCourses();
					renderTimetable();
				}
			}

			/* Modal Logic */
			function openModal(id = null) {
				editingCourseId = id;
				const modal = document.getElementById("modal");
				const title = document.getElementById("modal-title");
				const slotContainer = document.getElementById("slot-container");
				slotContainer.innerHTML = "";

				if (id) {
					title.textContent = "Edit Subject";
					const course = courses.find((c) => c.id === id);
					document.getElementById("course-code").value = course.code;
					document.getElementById("course-name").value = course.name;
					document.getElementById("course-instructor").value =
						course.instructor;
					document.getElementById("course-core").checked =
						!!course.isCore;
					document.getElementById("course-color").value =
						course.color;

					if (course.slots && course.slots.length > 0) {
						course.slots.forEach((slot) =>
							addSlotInput(slot.day, slot.slotIndex),
						);
					} else {
						addSlotInput();
					}
				} else {
					title.textContent = "Add Subject";
					document.getElementById("course-code").value = "";
					document.getElementById("course-name").value = "";
					document.getElementById("course-instructor").value = "";
					document.getElementById("course-core").checked = false;
					document.getElementById("course-color").value = "#3b82f6";
					addSlotInput();
				}

				modal.style.display = "flex";
			}

			function closeModal() {
				document.getElementById("modal").style.display = "none";
			}

			function addSlotInput(selectedDay = "Mon", selectedIndex = 0) {
				const slotContainer = document.getElementById("slot-container");
				const div = document.createElement("div");
				div.className = "slot-row";

				const daySelect = document.createElement("select");
				DAYS.forEach((d) => {
					const opt = document.createElement("option");
					opt.value = d;
					opt.textContent = d;
					if (d === selectedDay) opt.selected = true;
					daySelect.appendChild(opt);
				});

				const timeSelect = document.createElement("select");
				TIME_SLOTS.forEach((t, index) => {
					const opt = document.createElement("option");
					opt.value = index;
					opt.textContent = t;
					if (index === selectedIndex) opt.selected = true;
					timeSelect.appendChild(opt);
				});

				const removeBtn = document.createElement("button");
				removeBtn.className = "btn btn-danger";
				removeBtn.style.padding = "6px 10px";
				removeBtn.innerHTML = "&#10005;";
				removeBtn.onclick = () => div.remove();

				div.appendChild(daySelect);
				div.appendChild(timeSelect);
				div.appendChild(removeBtn);
				slotContainer.appendChild(div);
			}

			function saveCourse() {
				const code = document
					.getElementById("course-code")
					.value.trim();
				const name = document
					.getElementById("course-name")
					.value.trim();
				const instructor = document
					.getElementById("course-instructor")
					.value.trim();
				const isCore = document.getElementById("course-core").checked;
				const color = document.getElementById("course-color").value;

				if (!code) {
					alert("Please enter a course code.");
					return;
				}

				const slotRows = document.querySelectorAll(".slot-row");
				const slots = [];
				slotRows.forEach((row) => {
					const selects = row.querySelectorAll("select");
					slots.push({
						day: selects[0].value,
						slotIndex: parseInt(selects[1].value, 10),
					});
				});

				const style = hexToSoftStyles(color);

				if (editingCourseId) {
					const course = courses.find(
						(c) => c.id === editingCourseId,
					);
					course.code = code;
					course.name = name;
					course.instructor = instructor;
					course.isCore = isCore;
					course.color = style.color;
					course.bgColor = style.bgColor;
					course.textColor = style.textColor;
					course.slots = slots;
				} else {
					courses.push({
						id: "c_" + Date.now(),
						code,
						name,
						instructor,
						isCore,
						color: style.color,
						bgColor: style.bgColor,
						textColor: style.textColor,
						enabled: true,
						source: "custom",
						slots,
					});
				}

				saveState();
				closeModal();
				renderSidebar();
				renderOtherCourses();
				renderTimetable();
			}

			// Initialize schedule
			init();
		</script>
	</body>
</html>
