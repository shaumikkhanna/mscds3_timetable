<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Timetable Planner</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fca5a5; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    /* Sidebar / Course Panel */
    .sidebar {
      background: var(--panel);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      height: fit-content;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .course-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      background: #fafafa;
    }

    .sidebar-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .sidebar-section h2 {
      margin-bottom: 10px;
    }

    .category-group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      background: #ffffff;
      overflow: hidden;
    }

    .category-toggle {
      width: 100%;
      border: none;
      background: #f8fafc;
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }

    .category-toggle:hover {
      background: #f1f5f9;
    }

    .category-count {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .other-course-list {
      display: none;
      padding: 8px;
    }

    .category-group.open .other-course-list {
      display: block;
    }

    .other-course-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px 4px;
      border-top: 1px solid #eef2f7;
    }

    .other-course-item:first-child {
      border-top: none;
    }

    .other-course-item input {
      margin-top: 3px;
    }

    .other-course-details strong {
      display: block;
      font-size: 0.85rem;
    }

    .other-course-details span {
      color: var(--text-muted);
      display: block;
      font-size: 0.72rem;
    }

    .empty-note {
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 8px 2px;
    }

    .course-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-pill {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .course-details strong { display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; }
    .course-details span { font-size: 0.75rem; color: var(--text-muted); display: block; }

    /* Core Pill Tag */
    .core-pill {
      background: #0f172a;
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .course-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      padding: 4px 6px;
      border-radius: 4px;
    }
    .btn-icon:hover { color: var(--text); background: #f1f5f9; }

    /* Timetable Grid */
    .timetable-container {
      background: var(--panel);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid var(--border);
      text-align: center;
      padding: 8px;
      vertical-align: top;
      height: 105px;
    }

    th {
      background: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      height: 40px;
    }

    td.day-header {
      background: #f8fafc;
      font-weight: bold;
      vertical-align: middle;
      width: 70px;
    }

    /* Lunch Column Styles */
    th.lunch-header {
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
      width: 90px;
    }

    td.lunch-cell {
      background: #f1f5f9;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      vertical-align: middle;
      user-select: none;
    }

    .cell-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
    }

    .has-conflict {
      background-color: #fef2f2 !important;
      border: 2px dashed #f87171 !important;
    }

    /* Course Badge in Cell */
    .badge {
      padding: 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: left;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .badge .header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge .title { font-weight: bold; font-size: 0.85rem; }
    .badge .sub { font-size: 0.7rem; font-weight: normal; opacity: 0.85; }

    /* Unchecked light state */
    .badge.faint {
      background-color: #f8fafc !important;
      color: #a1a1aa !important;
      border: 1px dashed #d4d4d8 !important;
      box-shadow: none;
      opacity: 0.6;
    }

    .conflict-warning {
      color: #dc2626;
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: var(--radius);
      width: 440px;
      max-width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal h3 { margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .slot-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Subjects</h2>
      <div id="course-list"></div>
      <div class="sidebar-section">
        <h2>Other Courses</h2>
        <div id="other-course-groups"></div>
      </div>
    </aside>

    <!-- Main Timetable Grid -->
    <main class="timetable-container">
      <table>
        <thead>
          <tr id="table-header">
            <th>Day</th>
            <!-- Time headers added dynamically -->
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows added dynamically -->
        </tbody>
      </table>
    </main>
  </div>

  <!-- Modal for Adding / Editing Course -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Add Subject</h3>
      
      <div class="form-group">
        <label>Course Code (e.g. TSA)</label>
        <input type="text" id="course-code" placeholder="TSA">
      </div>
      
      <div class="form-group">
        <label>Course Name</label>
        <input type="text" id="course-name" placeholder="Time Series Analysis">
      </div>

      <div class="form-group">
        <label>Instructor</label>
        <input type="text" id="course-instructor" placeholder="M R Srinivasan">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="course-core">
        <label for="course-core" style="margin: 0; font-weight: 600; font-size: 0.85rem;">Mark as Core Course</label>
      </div>

      <div class="form-group">
        <label>Badge Color</label>
        <input type="color" id="course-color" value="#3b82f6">
      </div>

      <div class="form-group">
        <label>Class Timings</label>
        <div id="slot-container"></div>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 6px;" onclick="addSlotInput()">+ Add Time Slot</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveCourse()">Save Course</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "timetable_courses_data_v3";
    const OTHER_INTEREST_STORAGE_KEY = "timetable_other_course_interests_v1";

    const TIME_SLOTS = [
      "09:10–10:25",
      "10:30–11:45",
      "11:50–13:05",
      "14:00–15:15",
      "15:30–16:45",
      "17:00–18:15"
    ];

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];

    // Default CSV string used as a fallback if courses.csv is opened via local file protocol
    const EMBEDDED_CSV = `id,code,name,instructor,isCore,color,enabled,slots
c1,REG,Regression & Classification,Sourish Das,true,#ef4444,true,Tue:2|Thu:2
c2,AML,Advanced Machine Learning,Pranabendu Misra,true,#6366f1,true,Mon:2|Mon:3
c3,TSA,Time Series Analysis,M R Srinivasan,false,#3b82f6,false,Tue:2|Thu:2
c4,NETW,Network Fundamentals,Y Chandramouli,false,#8b5cf6,false,Tue:4|Thu:4
c5,RFLR,Reinforcement Learning,I Murugeswari,false,#ec4899,false,Mon:1|Wed:1
c6,MVG,Multiple View Geometry,Kavita Sutar,false,#10b981,false,Tue:1|Fri:1|Fri:2
c7,TAGT,Topics in Applied Graph Theory,Priyavrat Deshpande,false,#f59e0b,false,Wed:2
c8,NLP,Natural Language Processing,Ramaseshan Ramachandran,false,#06b6d4,false,Thu:0|Thu:3`;

    const EMBEDDED_OTHER_CSV = `Course Code,Course Name,Instructor,Category / Program,Schedule
PDE,"Sobolev Spaces & Applications to PDE",Prosenjit Roy,Maths Electives 3,"Thu 09:10-10:25, Fri 14:00-15:15"
SIO,Singular Integral Operators,M Sundari,Maths Electives 3,"Tue 15:30-16:45, Wed 09:10-10:25, Thu 14:00-15:15"
DGT,Differential Geometry & Topology,Akashdeep Dey,Maths Electives 3,"Wed 14:00-15:15, Fri 11:50-13:05"
PAT,Proofs and Types,S P Suresh,CS Electives 1,"Mon 14:00-15:15, Wed 14:00-15:15"
SVA,Software Verification and Analysis,M K Srivas,CS Electives 1,Unscheduled / TBD
ISS,Infinite State Systems-Well-Structured Systems,K Narayan Kumar,CS Electives 1,"Tue 09:10-10:25, Thu 09:10-10:25"
MAAT,Modern Aspects of Automata Theory,B Srivathsan,CS Electives 1,"Mon 10:30-11:45, Wed 10:30-11:45, Fri 10:30-11:45"

CM1,Classical Mechanics I (starts 12 Aug),K G Arun,B.S. I year,"Wed 14:00-15:15, Thu 10:30-11:45"
ENV,Environment Course,Speaker/Movie,B.S. I year,Fri 15:30-16:45
CRYP,Introduction to Cryptography,Varun Narayanan,CS Electives 2,"Mon 17:00-18:15, Wed 17:00-18:15"
PEA,Parameterized and Exact Algorithms,Philip Geevarghese,CS Electives 2,"Mon 10:30-11:45, Wed 10:30-11:45, Fri 10:30-11:45"
CP2,Complexity Theory II,Partha Mukhopadhyay,CS Electives 2,"Tue 14:00-15:15, Thu 14:00-15:15"
MFD,Matchings and Fair Division,Keshav Ranjan,CS Electives 2,"Wed 14:00-15:15, Fri 14:00-15:15"
MATH,Matroid Theory,Amit Sinhababu,CS Electives 2,Unscheduled / TBD
FML,Foundations of ML,K V Subrahmanyam,CS Electives 3,"Wed 11:50-13:05, Fri 11:50-13:05"
MPML,Mathematical Principles of Modern Machine Learning,K V Subrahmanyam,CS Electives 3,Unscheduled / TBD
PGAG,Permutation Group Algorithms and Graph Isomorphism,V Arvind,CS Electives 3,"Mon 14:00-15:15, Wed 14:00-15:15"
AAT,Applied Algebaric Topology,Siddharth Pritam,CS Electives 3,"Tue 10:30-11:45, Thu 10:30-11:45, Thu 11:50-13:05"
ALG3,Algebra III,Anwesh Ray,B.S. Math & CS II / B.S. Math & Physics II,"Mon 11:50-13:05, Mon 15:30-16:45"
ANA2,Analysis II,B V Rao,B.S. Math & CS II / B.S. Math & Physics II,"Tue 14:00-15:15, Wed 11:50-13:05, Thu 14:00-15:15"
ALGO,Design & Analysis of Algorithms,Prajakta Nimbhorkar,B.S. Math & CS II,"Wed 10:30-11:45, Fri 10:30-11:45"
CAL2,Calculus II,Manoj Kummini,B.S. Math & CS II / B.S. Math & Physics II,"Tue 11:50-13:05, Thu 11:50-13:05"
TOC,Theory of Computation,C Aiswarya,B.S. Math & CS II,"Tue 09:10-10:25, Thu 09:10-10:25"
CALG,Commutative Algebra I,Clare D'Cruz,Maths Electives 1,"Mon 10:30-11:45, Tue 09:10-10:25, Thu 09:10-10:25"
GGT,Geometric Group Theory,P Sankaran,Maths Electives 1,"Wed 11:50-13:05, Fri 11:50-13:05"
AG1,Algebraic Geometry 1,Yashonidhi Pandey,Maths Electives 1,"Mon 09:10-10:25, Wed 09:10-10:25"
LIEA,Lie Algebras,S Senthamarai Kannan,Maths Electives 1,"Tue 14:00-15:15, Thu 14:00-15:15"
QM1,Quantum Mechanics I,Alok Laddha,B.S. Math & Physics II,"Tue 10:30-11:45, Wed 10:30-11:45"
EM2,Electromagnetism II,V V Sreedhar,B.S. Math & Physics II,"Tue 15:30-16:45, Thu 15:30-16:45"
LAB,Physics Lab,K G M Nair,B.S. Math & Physics II,"Fri 14:00-15:15, Fri 15:30-16:45"
IMF,Intro to Modular Forms (starts 6 Aug),B Ramakrishnan,Maths Electives 2,"Tue 15:30-16:45, Thu 15:30-16:45"
IEC,Intro to Elliptic Curves,Aditya Karnataki,Maths Electives 2,"Tue 10:30-11:45, Wed 10:30-11:45, Thu 10:30-11:45"
PAPF,"Intro to p-adic analysis & p-adic L-functions (starts 14 Aug)",Purusottam Rath,Maths Electives 2,"Mon 11:50-13:05, Fri 11:50-13:05"
TGS,Topics in Group Schemes,V Balaji,Maths Electives 2,"Tue 11:50-13:05, Thu 11:50-13:05"`;

    let courses = [];
    let otherCourses = [];
    let editingCourseId = null;

    function hexToSoftStyles(hex) {
      return {
        bgColor: hex + "25",
        textColor: hex,
        color: hex
      };
    }

    function parseCSVRows(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          cell += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && nextChar === "\n") i++;
          row.push(cell.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      if (row.some(value => value !== "")) rows.push(row);
      return rows;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function parseCSV(csvText) {
      const lines = parseCSVRows(csvText);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i];
        const slotsRaw = cols[7] ? cols[7].split("|") : [];
        const slots = slotsRaw.map(s => {
          const [day, idx] = s.split(":");
          return { day, slotIndex: parseInt(idx, 10) };
        });

        const color = cols[5] || "#3b82f6";
        const styles = hexToSoftStyles(color);

        result.push({
          id: cols[0],
          code: cols[1],
          name: cols[2],
          instructor: cols[3],
          isCore: cols[4] === "true",
          color: styles.color,
          bgColor: styles.bgColor,
          textColor: styles.textColor,
          enabled: cols[6] === "true",
          source: "main",
          slots: slots
        });
      }
      return result;
    }

    function categoryLabel(category) {
      const normalized = (category || "Other").trim();
      if (/math/i.test(normalized)) return "Math";
      if (/\bcs\b|computer/i.test(normalized)) return "CS";
      if (/\bb\.?s\.?\b|bachelor/i.test(normalized)) return "BS";
      return normalized;
    }

    function colorForIndex(index) {
      const colors = [
        "#0ea5e9", "#22c55e", "#f97316", "#a855f7", "#14b8a6",
        "#e11d48", "#64748b", "#84cc16", "#f59e0b", "#6366f1"
      ];
      return colors[index % colors.length];
    }

    function parseSchedule(schedule) {
      if (!schedule || /unscheduled|tbd/i.test(schedule)) return [];

      const normalizedSlots = TIME_SLOTS.map(slot => slot.replace("–", "-"));
      return schedule.split(",").map(part => {
        const match = part.trim().match(/^(Mon|Tue|Wed|Thu|Fri)\s+(\d{2}:\d{2}-\d{2}:\d{2})$/);
        if (!match) return null;
        const slotIndex = normalizedSlots.indexOf(match[2]);
        if (slotIndex === -1) return null;
        return { day: match[1], slotIndex };
      }).filter(Boolean);
    }

    function parseOtherCSV(csvText) {
      const rows = parseCSVRows(csvText);
      const result = [];

      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i];
        const color = colorForIndex(i - 1);
        const styles = hexToSoftStyles(color);

        result.push({
          id: "other_" + cols[0],
          code: cols[0],
          name: cols[1],
          instructor: cols[2],
          category: cols[3] || "Other",
          categoryGroup: categoryLabel(cols[3]),
          scheduleText: cols[4] || "Unscheduled / TBD",
          isCore: false,
          color: styles.color,
          bgColor: styles.bgColor,
          textColor: styles.textColor,
          enabled: false,
          source: "other",
          slots: parseSchedule(cols[4])
        });
      }

      return result;
    }

    async function loadDefaultCSV() {
      try {
        const response = await fetch("courses.csv");
        if (response.ok) {
          const text = await response.text();
          return parseCSV(text);
        }
      } catch (e) {
        console.warn("Could not fetch external courses.csv (likely file:// protocol). Using embedded defaults.");
      }
      return parseCSV(EMBEDDED_CSV);
    }

    async function loadOtherCSV() {
      try {
        const response = await fetch("other_courses.csv");
        if (response.ok) {
          const text = await response.text();
          return parseOtherCSV(text);
        }
      } catch (e) {
        console.warn("Could not fetch external other_courses.csv (likely file:// protocol). Using embedded defaults.");
      }
      return parseOtherCSV(EMBEDDED_OTHER_CSV);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
      const interestedIds = courses
        .filter(course => course.source === "other")
        .map(course => course.id);
      localStorage.setItem(OTHER_INTEREST_STORAGE_KEY, JSON.stringify(interestedIds));
    }

    function promoteInterestedOtherCourses(interestedIds) {
      interestedIds.forEach(id => {
        if (courses.some(course => course.id === id)) return;
        const otherCourse = otherCourses.find(course => course.id === id);
        if (otherCourse) {
          courses.push({
            ...otherCourse,
            enabled: true
          });
        }
      });
    }

    async function init() {
      otherCourses = await loadOtherCSV();
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          courses = JSON.parse(saved);
        } catch (e) {
          courses = await loadDefaultCSV();
        }
      } else {
        courses = await loadDefaultCSV();
      }

      const interestedSaved = localStorage.getItem(OTHER_INTEREST_STORAGE_KEY);
      if (interestedSaved) {
        try {
          promoteInterestedOtherCourses(JSON.parse(interestedSaved));
        } catch (e) {
          console.warn("Could not restore other course interests.");
        }
      }

      renderHeaders();
      renderSidebar();
      renderOtherCourses();
      renderTimetable();
    }

    async function resetDefaults() {
      if (confirm("Reset schedule back to CSV defaults? Any custom modifications will be cleared.")) {
        courses = await loadDefaultCSV();
        localStorage.removeItem(OTHER_INTEREST_STORAGE_KEY);
        saveState();
        renderSidebar();
        renderOtherCourses();
        renderTimetable();
      }
    }

    function renderHeaders() {
      const headerRow = document.getElementById("table-header");
      headerRow.innerHTML = "<th>Day</th>";
      
      TIME_SLOTS.forEach((slot, index) => {
        const th = document.createElement("th");
        th.textContent = slot;
        headerRow.appendChild(th);

        // Inject Lunch Break header after slot 2 (11:50-13:05)
        if (index === 2) {
          const lunchTh = document.createElement("th");
          lunchTh.className = "lunch-header";
          lunchTh.textContent = "13:05–14:00 (Lunch)";
          headerRow.appendChild(lunchTh);
        }
      });
    }

    function renderSidebar() {
      const list = document.getElementById("course-list");
      list.innerHTML = "";

      courses.forEach(course => {
        const item = document.createElement("div");
        item.className = "course-item";
        item.innerHTML = `
          <div class="course-info">
            <input type="checkbox" ${course.enabled ? "checked" : ""} onchange="toggleCourse('${course.id}')">
            <div class="color-pill" style="background-color: ${course.color}"></div>
            <div class="course-details">
              <strong>
                ${escapeHtml(course.code)}
                ${course.isCore ? '<span class="core-pill">CORE</span>' : ''}
              </strong>
              <span>${escapeHtml(course.name)}</span>
            </div>
          </div>
          <div class="course-actions">
            <button class="btn-icon" onclick="openModal('${course.id}')" title="Edit">&#9998;</button>
            <button class="btn-icon" onclick="deleteCourse('${course.id}')" title="Delete">&#10005;</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function renderOtherCourses() {
      const container = document.getElementById("other-course-groups");
      container.innerHTML = "";

      const grouped = otherCourses.reduce((acc, course) => {
        if (!acc[course.categoryGroup]) acc[course.categoryGroup] = [];
        acc[course.categoryGroup].push(course);
        return acc;
      }, {});

      Object.keys(grouped).sort().forEach(category => {
        const group = document.createElement("div");
        group.className = "category-group";

        const interestedCount = grouped[category].filter(course =>
          courses.some(selected => selected.id === course.id)
        ).length;

        const listHtml = grouped[category].map(course => {
          const isInterested = courses.some(selected => selected.id === course.id);
          return `
            <label class="other-course-item">
              <input type="checkbox" ${isInterested ? "checked" : ""} onchange="toggleOtherInterest('${course.id}', this.checked)">
              <span class="other-course-details">
                <strong>${escapeHtml(course.code)} - ${escapeHtml(course.name)}</strong>
                <span>${escapeHtml(course.instructor)}</span>
                <span>${escapeHtml(course.scheduleText)}</span>
              </span>
            </label>
          `;
        }).join("");

        group.innerHTML = `
          <button class="category-toggle" type="button" onclick="toggleCategory(this)">
            <span>${escapeHtml(category)}</span>
            <span class="category-count">${interestedCount}/${grouped[category].length}</span>
          </button>
          <div class="other-course-list">
            ${listHtml || '<div class="empty-note">No courses here.</div>'}
          </div>
        `;

        container.appendChild(group);
      });
    }

    function renderTimetable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      DAYS.forEach(day => {
        const tr = document.createElement("tr");

        const dayTd = document.createElement("td");
        dayTd.className = "day-header";
        dayTd.textContent = day;
        tr.appendChild(dayTd);

        TIME_SLOTS.forEach((slot, slotIndex) => {
          const td = document.createElement("td");
          const cellContent = document.createElement("div");
          cellContent.className = "cell-content";

          const matchingCourses = courses.filter(c => 
            c.slots && c.slots.some(s => s.day === day && s.slotIndex === slotIndex)
          );

          const activeCourses = matchingCourses.filter(c => c.enabled);
          if (activeCourses.length > 1) {
            td.classList.add("has-conflict");
          }

          matchingCourses.forEach(course => {
            const badge = document.createElement("div");
            if (course.enabled) {
              badge.className = "badge";
              badge.style.backgroundColor = course.bgColor;
              badge.style.color = course.textColor;
              badge.style.borderLeft = `4px solid ${course.color}`;
            } else {
              badge.className = "badge faint";
            }

            badge.innerHTML = `
              <div class="header-line">
                <span class="title">${escapeHtml(course.code)}</span>
                ${course.isCore && course.enabled ? '<span class="core-pill">CORE</span>' : ''}
              </div>
              <div class="sub">${escapeHtml(course.instructor || '')}</div>
            `;
            cellContent.appendChild(badge);
          });

          if (activeCourses.length > 1) {
            const warning = document.createElement("div");
            warning.className = "conflict-warning";
            warning.innerHTML = "<span>&#9888;</span> Conflict";
            cellContent.appendChild(warning);
          }

          td.appendChild(cellContent);
          tr.appendChild(td);

          // Inject Lunch Break cell after slotIndex 2
          if (slotIndex === 2) {
            const lunchTd = document.createElement("td");
            lunchTd.className = "lunch-cell";
            lunchTd.textContent = "LUNCH";
            tr.appendChild(lunchTd);
          }
        });

        tbody.appendChild(tr);
      });
    }

    function toggleCourse(id) {
      const course = courses.find(c => c.id === id);
      if (course) {
        course.enabled = !course.enabled;
        saveState();
        renderSidebar();
        renderTimetable();
      }
    }

    function toggleCategory(button) {
      button.closest(".category-group").classList.toggle("open");
    }

    function toggleOtherInterest(id, checked) {
      if (checked) {
        const otherCourse = otherCourses.find(course => course.id === id);
        if (otherCourse && !courses.some(course => course.id === id)) {
          courses.push({
            ...otherCourse,
            enabled: true
          });
        }
      } else {
        courses = courses.filter(course => course.id !== id);
      }

      saveState();
      renderSidebar();
      renderOtherCourses();
      renderTimetable();
    }

    function deleteCourse(id) {
      if (confirm("Are you sure you want to delete this course?")) {
        courses = courses.filter(c => c.id !== id);
        saveState();
        renderSidebar();
        renderOtherCourses();
        renderTimetable();
      }
    }

    /* Modal Logic */
    function openModal(id = null) {
      editingCourseId = id;
      const modal = document.getElementById("modal");
      const title = document.getElementById("modal-title");
      const slotContainer = document.getElementById("slot-container");
      slotContainer.innerHTML = "";

      if (id) {
        title.textContent = "Edit Subject";
        const course = courses.find(c => c.id === id);
        document.getElementById("course-code").value = course.code;
        document.getElementById("course-name").value = course.name;
        document.getElementById("course-instructor").value = course.instructor;
        document.getElementById("course-core").checked = !!course.isCore;
        document.getElementById("course-color").value = course.color;

        if (course.slots && course.slots.length > 0) {
          course.slots.forEach(slot => addSlotInput(slot.day, slot.slotIndex));
        } else {
          addSlotInput();
        }
      } else {
        title.textContent = "Add Subject";
        document.getElementById("course-code").value = "";
        document.getElementById("course-name").value = "";
        document.getElementById("course-instructor").value = "";
        document.getElementById("course-core").checked = false;
        document.getElementById("course-color").value = "#3b82f6";
        addSlotInput();
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function addSlotInput(selectedDay = "Mon", selectedIndex = 0) {
      const slotContainer = document.getElementById("slot-container");
      const div = document.createElement("div");
      div.className = "slot-row";

      const daySelect = document.createElement("select");
      DAYS.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        if (d === selectedDay) opt.selected = true;
        daySelect.appendChild(opt);
      });

      const timeSelect = document.createElement("select");
      TIME_SLOTS.forEach((t, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.textContent = t;
        if (index === selectedIndex) opt.selected = true;
        timeSelect.appendChild(opt);
      });

      const removeBtn = document.createElement("button");
      removeBtn.className = "btn btn-danger";
      removeBtn.style.padding = "6px 10px";
      removeBtn.innerHTML = "&#10005;";
      removeBtn.onclick = () => div.remove();

      div.appendChild(daySelect);
      div.appendChild(timeSelect);
      div.appendChild(removeBtn);
      slotContainer.appendChild(div);
    }

    function saveCourse() {
      const code = document.getElementById("course-code").value.trim();
      const name = document.getElementById("course-name").value.trim();
      const instructor = document.getElementById("course-instructor").value.trim();
      const isCore = document.getElementById("course-core").checked;
      const color = document.getElementById("course-color").value;

      if (!code) {
        alert("Please enter a course code.");
        return;
      }

      const slotRows = document.querySelectorAll(".slot-row");
      const slots = [];
      slotRows.forEach(row => {
        const selects = row.querySelectorAll("select");
        slots.push({
          day: selects[0].value,
          slotIndex: parseInt(selects[1].value, 10)
        });
      });

      const style = hexToSoftStyles(color);

      if (editingCourseId) {
        const course = courses.find(c => c.id === editingCourseId);
        course.code = code;
        course.name = name;
        course.instructor = instructor;
        course.isCore = isCore;
        course.color = style.color;
        course.bgColor = style.bgColor;
        course.textColor = style.textColor;
        course.slots = slots;
      } else {
        courses.push({
          id: "c_" + Date.now(),
          code,
          name,
          instructor,
          isCore,
          color: style.color,
          bgColor: style.bgColor,
          textColor: style.textColor,
          enabled: true,
          source: "custom",
          slots
        });
      }

      saveState();
      closeModal();
      renderSidebar();
      renderOtherCourses();
      renderTimetable();
    }

    // Initialize schedule
    init();
  </script>
</body>
</html>
